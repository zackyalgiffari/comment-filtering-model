[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comment-filtering-model"
version = "0.1.0"
description = "Open-weight Qwen3.5 comment-filtering pipeline for OTT live chat."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=0.34.0",
  "datasets>=2.20.0",
  "numpy>=1.26.0",
  "peft>=0.12.0",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.0",
  "scikit-learn>=1.4.0",
  "torch>=2.3.0",
  "transformers>=4.57.3",
  "trl>=0.25.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]
serving = [
  "openai>=1.40.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
